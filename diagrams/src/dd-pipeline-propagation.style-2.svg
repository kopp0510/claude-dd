<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" width="1440" height="1060">
<style>
  text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New','PingFang TC','Noto Sans CJK TC',monospace;
         fill: #e2e8f0; letter-spacing: 0.02em; }
  .ttl { font-size: 24px; font-weight: 700; fill: #e2e8f0; }
  .sub { font-size: 16px; fill: #475569; }
  .lbl { font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 0.1em; }
  .nm  { font-size: 20px; font-weight: 700; }
  .sm  { font-size: 15px; fill: #94a3b8; }
  .al  { font-size: 15px; fill: #64748b; }
</style>
<defs>
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
  </linearGradient>
  <marker id="a-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
  <marker id="a-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
  <marker id="a-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
  <marker id="a-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eab308"/></marker>
</defs>

<rect width="1440" height="1060" fill="url(#bg-grad)"/>

