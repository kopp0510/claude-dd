<text class="sm" x="1060" y="706">CLAUDE.md +</text>
<text class="sm" x="1060" y="726">.git/hooks/pre-commit</text>

<rect data-role="node" x="590" y="650" width="320" height="84" rx="6" fill="#052e16" stroke="#059669" stroke-width="1.5"/>
<text class="nm" x="610" y="682" fill="#10b981">8 步開發迴圈</text>
<text class="sm" x="610" y="706">實作+測試 → commit → 簡化</text>
<text class="sm" x="610" y="726">→ review → 再測 → commit …</text>

<polygon data-role="node" points="330,634 480,692 330,750 180,692" fill="#1c0f16" stroke="#ef4444" stroke-width="2"/>
<text class="nm" x="330" y="686" text-anchor="middle" fill="#ef4444" font-size="16">pre-commit gate</text>
<text x="330" y="708" text-anchor="middle" font-size="14" fill="#94a3b8">CLAUDE.md 同批更新？</text>

<rect data-role="node" x="200" y="850" width="260" height="68" rx="6" fill="#1a1505" stroke="#eab308" stroke-width="1.5"/>
<text class="nm" x="220" y="882" fill="#eab308">commit OK</text>
<text class="sm" x="220" y="904">改碼與文件同批落地</text>

