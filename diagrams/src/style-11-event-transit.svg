  .med { font-size:16px; font-weight:700; fill:#fffdf8; }
</style>
<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#dfd6c4" opacity="0.55"/>
