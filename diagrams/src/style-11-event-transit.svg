<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720">
<style>
  text { font-family: -apple-system,'Helvetica Neue','PingFang TC','Noto Sans CJK TC',sans-serif; fill:#17213c; }
  .ttl { font-size:26px; font-weight:700; }
  .sub { font-size:15px; fill:#6b7280; }
  .stamp { font-size:13px; font-weight:700; fill:#8a94a6; letter-spacing:0.12em; }
  .nm { font-size:19px; font-weight:700; }
  .sm { font-size:14px; fill:#5b6577; }
  .al { font-size:14px; fill:#6b7280; }
