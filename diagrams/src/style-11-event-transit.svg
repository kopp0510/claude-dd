  <marker id="m-dlq" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker>
  <marker id="m-state" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 8 3, 0 6" fill="#00897b"/></marker>
</defs>

<rect width="1440" height="720" fill="#fbf7ee"/>
