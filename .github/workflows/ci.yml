name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # 手動在任意分支跑（例如負面測試：gh workflow run CI --ref <分支>）

jobs:
  lint:
    name: 安裝腳本檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 語法檢查
        run: bash -n install-dd-pipeline.sh

      - name: ShellCheck（warning 級，清單逐檔寫死 — 新增腳本要自己加進來）
        run: |
          shellcheck -S warning \
            install-dd-pipeline.sh \
            scripts/check-claude-md.sh \
            scripts/githooks/pre-commit \
            skills/self-improving-agent/hooks/error-capture.sh \
            skills/self-improving-agent/hooks/test-error-capture.sh \
            skills/gate-guard/hooks/guard-no-verify.sh \
            skills/gate-guard/hooks/test-guard-no-verify.sh \
            tests/test-gate.sh \
            tests/test-install.sh

      - name: help smoke test
        run: ./install-dd-pipeline.sh --help

      - name: Skill hook 路徑驗證
        run: |
          source ./install-dd-pipeline.sh
          validate_skill_hooks

      # 幾何閘門自己會錯，而且全判通過（漏檢）與全判失敗（假陽性）看起來都像正常結果 ——
      # 這支負面測試是唯一的防線。純標準庫，ubuntu runner 自帶 python3，無額外依賴。
      - name: tech-diagram-gif 幾何閘門自我測試（變異 / 回歸 / 警告案例）
        run: python3 skills/tech-diagram-gif/scripts/test-verify-geometry.py

      # 這支 hook 的失效是完全靜默的（零輸出、exit 0，與「真的沒錯誤」無法區分），
      # shellcheck 與 bash -n 都驗不出來 —— 只有行為測試抓得到。純 bash，無外部依賴。
      - name: error-capture hook 行為測試（觸發 / 靜默各情境）
        run: ./skills/self-improving-agent/hooks/test-error-capture.sh

      # gate-guard 該擋沒擋時同樣是零輸出、exit 0，跟「沒人繞過」長得一樣；反過來誤擋
      # git config core.hooksPath、git log -n 會卡住日常操作 —— 兩個方向都只有行為測試抓得到
      - name: gate-guard hook 行為測試（該擋 / 該放行各情境）
        run: ./skills/gate-guard/hooks/test-guard-no-verify.sh

      - name: 陣列與目錄一致性（ALL_* 四組 + DD_SCRIPTS）
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          check() {
            local label="$1" expected="$2" actual="$3"
            if ! diff <(echo "$expected") <(echo "$actual"); then
              echo "❌ ${label}：陣列與實際目錄不一致（< 陣列 / > 目錄）"
              fail=1
            else
              echo "✅ $label 一致"
            fi
          }
          check "ALL_SKILLS" \
            "$(printf "%s\n" "${ALL_SKILLS[@]}" | sort)" \
            "$(ls -d skills/*/ | xargs -n1 basename | sort)"
          check "ALL_AGENTS" \
            "$(printf "%s\n" "${ALL_AGENTS[@]}" | sort)" \
            "$(ls agents/*.md | xargs -n1 basename | sed 's/\.md$//' | sort)"
          check "ALL_DD_COMMANDS" \
            "$(printf "%s\n" "${ALL_DD_COMMANDS[@]}" | sort)" \
            "$(ls commands/dd-*.md | xargs -n1 basename | sed 's/\.md$//' | sort)"
          check "ALL_NS_COMMANDS" \
            "$(printf "%s\n" "${ALL_NS_COMMANDS[@]}" | sort)" \
            "$(ls -d commands/*/ | xargs -n1 basename | sort)"
          # scripts/ 是後果最嚴重的一類（gate 腳本在這層），卻是最晚補上檢查的：
          # 忘了加進 DD_SCRIPTS 時 create_scripts() 不會部署它，使用者機器上 ~/.claude/scripts/
          # 根本沒有那支腳本，而 repo 裡檔案在、CI 全綠，只有到別人的機器上才會炸。
          # githooks/ 不部署，本來就不在 scripts/*.sh 這個 glob 內
          check "DD_SCRIPTS" \
            "$(printf "%s\n" "${DD_SCRIPTS[@]}" | sort)" \
            "$(ls scripts/*.sh | xargs -n1 basename | sort)"
          exit $fail

      - name: 數字宣稱一致性（README ×2 / CLAUDE.md / 架構文件 ↔ 腳本陣列）
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          ck() {
            local label="$1" claimed="$2" actual="$3"
            if [ -n "$claimed" ] && [ "$claimed" = "$actual" ]; then
              echo "✅ ${label}：${actual}"
            else
              echo "❌ ${label}：宣稱「${claimed:-未找到}」，實際 ${actual}"
              fail=1
            fi
          }

          # README（英文預設 + 繁中）：安裝章節數字、Promoted Skills 標題數字與表格內容
          # 正規式刻意做成語言無關 —「10 個 promoted Skills」與「10 promoted Skills」都吃，
          # 兩份都驗，否則沒被驗的那份會靜靜過期
          for rf in README.md README.zh-TW.md; do
            [ -f "$rf" ] || { echo "❌ 找不到 $rf"; fail=1; continue; }

            ck "${rf} 安裝 promoted skills 數" \
              "$(grep -oE "[0-9]+( 個)? promoted Skills" "$rf" | grep -oE "^[0-9]+" | head -1)" \
              "${#PROMOTED_SKILLS[@]}"
            ck "${rf} 安裝 promoted agents 數" \
              "$(grep -oE "[0-9]+( 個)? promoted Agents" "$rf" | grep -oE "^[0-9]+" | head -1)" \
              "${#PROMOTED_AGENTS[@]}"

            ck "${rf} Promoted Skills 標題數" \
              "$(grep -oE "^## Promoted Skills[^0-9]*[0-9]+" "$rf" | grep -oE "[0-9]+$" | head -1)" \
              "${#PROMOTED_SKILLS[@]}"
            tbl=$(awk '/^## Promoted Skills/{f=1;next} f&&/^## /{exit} f' "$rf" \
              | awk -F'|' '/^\| [a-z]/{gsub(/ /,"",$2); print $2}' | sort)
            if ! diff <(printf "%s\n" "${PROMOTED_SKILLS[@]}" | sort) <(echo "$tbl"); then
              echo "❌ ${rf} Promoted Skills 表格與 PROMOTED_SKILLS 陣列不一致（< 陣列 / > 表格）"
              fail=1
            else
              echo "✅ ${rf} Promoted Skills 表格一致"
            fi
          done

          # 專案 CLAUDE.md 目錄結構數字
          ck "CLAUDE.md skills 總數" \
            "$(grep -oE "skills/\` — [0-9]+ 個 Skills" CLAUDE.md | grep -oE "[0-9]+")" \
            "${#ALL_SKILLS[@]}"
          ck "CLAUDE.md agents 總數" \
            "$(grep -oE "agents/\` — [0-9]+ 個 Agents" CLAUDE.md | grep -oE "[0-9]+")" \
            "${#ALL_AGENTS[@]}"
          ck "CLAUDE.md dd 指令總數" \
            "$(grep -oE "[0-9]+ 個 dd-\* 指令" CLAUDE.md | grep -oE "^[0-9]+")" \
            "${#ALL_DD_COMMANDS[@]}"
          ck "CLAUDE.md NS command 總數" \
            "$(grep -oE "[0-9]+ 個命名空間 command 目錄" CLAUDE.md | grep -oE "^[0-9]+")" \
            "${#ALL_NS_COMMANDS[@]}"

          # DD_PIPELINE_ARCHITECTURE.md（2026-09-12 補）：這份文件原本完全不在數字檢查範圍內，
          # 改陣列時會靜默過期。ck() 的 claimed 為空時會判失敗，所以抓不到也不會靜默放過。
          ck "架構文件 promoted skills 數" \
            "$(grep -oE "[0-9]+ 個 promoted Skills" DD_PIPELINE_ARCHITECTURE.md | grep -oE "^[0-9]+")" \
            "${#PROMOTED_SKILLS[@]}"
          ck "架構文件 promoted agents 數" \
            "$(grep -oE "[0-9]+ 個 promoted Agents" DD_PIPELINE_ARCHITECTURE.md | grep -oE "^[0-9]+")" \
            "${#PROMOTED_AGENTS[@]}"
          # 安裝腳本的編號步驟數 = print_step "n/N" 裡最大的 N
          ck "架構文件 安裝編號步驟數" \
            "$(grep -oE "[0-9]+ 個編號步驟" DD_PIPELINE_ARCHITECTURE.md | grep -oE "^[0-9]+")" \
            "$(grep -oE 'print_step "[0-9]+/[0-9]+"' install-dd-pipeline.sh \
               | grep -oE '/[0-9]+' | tr -d '/' | sort -rn | head -1)"
          # shellcheck 清單逐檔寫死，數它列了幾個檔名（不含 shellcheck 指令那行）
          ck "架構文件 shellcheck 腳本數" \
            "$(grep -oE "[0-9]+ 支腳本" DD_PIPELINE_ARCHITECTURE.md | grep -oE "^[0-9]+")" \
            "$(awk '/shellcheck -S warning/,/^$/' .github/workflows/ci.yml \
               | grep -cE '(\.sh|pre-commit)( \\)?$')"
          exit $fail

      - name: 安裝 flag 三方對照（README ↔ --help ↔ 腳本 case 分支）
        run: |
          fail=0
          # 腳本實際支援的 flag：頂層參數解析的 case 分支
          script_flags=$(grep -oE '^[[:space:]]+--[a-z-]+\)' install-dd-pipeline.sh \
            | tr -d ' )' | sort -u)
          # --help 印出的選項清單
          help_flags=$(./install-dd-pipeline.sh --help \
            | grep -oE '^[[:space:]]+--[a-z-]+' | tr -d ' ' | sort -u)
          # 兩份 README 的指令範例：只取 ./install-dd-pipeline.sh 後面接的 flag，
          # 否則會誤抓別的指令的參數（README 有 `claude mcp add --scope user`）
          readme_flags=$(grep -hoE '\./install-dd-pipeline\.sh( --[a-z-]+)+' README.md README.zh-TW.md \
            | grep -oE -- '--[a-z-]+' | sort -u)

          cmp_flags() {
            local label="$1" a="$2" b="$3"
            if diff <(echo "$a") <(echo "$b"); then
              echo "✅ ${label} 一致"
            else
              echo "❌ ${label} 不一致（< 前者 / > 後者）"
              fail=1
            fi
          }
          cmp_flags "腳本 case 分支 ↔ --help 輸出" "$script_flags" "$help_flags"
          cmp_flags "腳本 case 分支 ↔ README 指令範例" "$script_flags" "$readme_flags"
          exit $fail

      - name: 全域模板 §7.2 觸發目標存在性與部署
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          # Claude Code 內建 skill 白名單：§7.2 可指向、但不由本 repo 部署的目標
          BUILTIN_CC_SKILLS="claude-api"
          # 表格第三欄（呼叫目標）只抽一次，兩道護欄與底下的檢查都從這份算 —— 抽兩次的話，
          # 改了其中一個 awk 範圍、另一個沒跟著改，兩邊會靜靜對不起來
          rows=$(awk '/^### 7\.2/,/^### 7\.3/' templates/global/CLAUDE.md | awk -F'|' '/^\|/{print $3}')
          targets=$(printf '%s\n' "$rows" | grep -oE '`[^`]+`' | tr -d '`' | sort -u)
          # 護欄一：抓不到就是 regex 失效（§7 重新編號、標題改寫、表格改欄數都會踩到）。
          # 沒有這道護欄時 while 迴圈一次都不跑、印綠燈，這個 step 的職責等於整個消失。
          # ⚠️ 這道必須留在下面 n_ticked 之前：grep -c 零命中回 1，在 bash -e 下會整段靜默
          # 中止、一個字都不印。把順序調過來就重新打開這個洞
          [ -n "$targets" ] || { echo "❌ §7.2 抓不到任何觸發目標（§7 重新編號？表格改欄數？整表都沒反引號？）"; exit 1; }
          # 護欄二：資料列數 ↔ 有反引號的列數。單獨一列掉了反引號會被 grep -oE 靜靜略過，
          # 那一列的目標從此不受檢查（不能拿 targets 筆數來比 — 它是 sort -u 過的）
          n_rows=$(printf '%s\n' "$rows" | awk '{gsub(/^[ \t]+|[ \t]+$/,"")} $0!="" && $0!="呼叫" && $0!~/^-+$/' | grep -c .)
          n_ticked=$(printf '%s\n' "$rows" | grep -c '`')
          [ "$n_rows" = "$n_ticked" ] || { echo "❌ §7.2 資料列 $n_rows 列、有反引號的 $n_ticked 列 —— 某列漏了反引號，或表頭／分隔列的格式改過了"; exit 1; }
          echo "（§7.2 資料列 $n_rows 列，全部有反引號）"
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            base="${t##*:}"; ns="${t%%:*}"
            if printf '%s\n' "${PROMOTED_SKILLS[@]}" | grep -qx "$base" && [ -d "skills/$base" ]; then
              echo "✅ ${t}（promoted skill）"
            elif printf '%s\n' "${PROMOTED_AGENTS[@]}" | grep -qx "$base" && [ -f "agents/$base.md" ]; then
              echo "✅ ${t}（promoted agent）"
            elif [ "$t" != "$base" ] && printf '%s\n' "${OFFICIAL_PLUGINS[@]}" | grep -qx "$ns"; then
              echo "✅ ${t}（官方 plugin，install_plugins 會安裝）"
            elif printf '%s\n' "$BUILTIN_CC_SKILLS" | grep -qx "$base"; then
              echo "✅ ${t}（Claude Code 內建 skill）"
            else
              echo "❌ §7.2 觸發目標未預設部署（不在部署清單 / 官方 plugin / 內建白名單）：$t"; fail=1
            fi
          done <<< "$targets"
          exit $fail

      - name: 迴圈步數四方一致（全域模板 ↔ dd-init 蓋章版 ↔ 兩份 README ↔ 版本標記）
        run: |
          # 2026-08-31 迴圈 6→7→8 時，README 清單漏補一項、dd-loop-version 停在 6step，
          # 兩者都不會報錯只會靜默失效（舊專案跑 /dd-init 會被判定「已是最新」）
          count_block() {  # $1=檔案 $2=區塊起始 regex $3=區塊結束 regex
            sed -n "/$2/,/$3/p" "$1" | grep -cE '^[0-9]+\. '
          }
          count_fence() {  # $1=檔案 $2=章節標題 regex：數該章節第一個 ``` 圍欄內的編號項
            awk -v pat="$2" '$0 ~ pat {f=1} f&&/^```$/{c++; if(c==2)f=0} f&&c==1&&/^[0-9]+\./{n++} END{print n+0}' "$1"
          }
          n_tpl=$(count_block templates/global/CLAUDE.md '^### 3\.9' '^> 步驟 1')
          n_dd=$(count_block commands/dd-init.md '^## 開發流程' '^驗證不過')
          n_en=$(count_fence README.md '^## The core loop')
          n_zh=$(count_fence README.zh-TW.md '^## 核心工作法')
          tag=$(grep -o 'dd-loop-version: [0-9a-z]*' commands/dd-init.md | head -1 | awk '{print $2}')
          echo "全域模板 §3.9=$n_tpl  dd-init 蓋章版=$n_dd  README.md=$n_en  README.zh-TW=$n_zh  標記=$tag"
          fail=0
          [ "$n_tpl" -gt 0 ] || { echo "❌ 全域模板 §3.9 抓不到步驟，檢查腳本的區塊 regex 失效"; fail=1; }
          for pair in "dd-init:$n_dd" "README.md:$n_en" "README.zh-TW.md:$n_zh"; do
            name="${pair%%:*}"; got="${pair##*:}"
            [ "$got" = "$n_tpl" ] || { echo "❌ $name 是 $got 步，與全域模板 §3.9 的 $n_tpl 步不一致"; fail=1; }
          done
          [ "$tag" = "${n_tpl}step" ] || { echo "❌ dd-loop-version 是 ${tag}，應為 ${n_tpl}step — 標記過期會讓 /dd-init 誤判舊專案已是最新"; fail=1; }
          # dd-loop-rev（同一個步數裡的修訂版）：蓋章標記與 Phase 1 偵測文字只改一邊時，
          # 會把剛蓋章的專案判成舊版、或把舊專案判成最新，兩種都不報錯
          if ! grep -qE '^<!-- dd-loop-version: [0-9a-z]+；dd-loop-rev: [0-9]+；' commands/dd-init.md; then
            echo "❌ dd-init 蓋章版標記抓不到 dd-loop-rev（標記格式改了的話，這裡的 regex 要跟著改）"; fail=1
          fi
          revs=$(grep -oE 'dd-loop-rev: [0-9]+' commands/dd-init.md | sort -u | tr '\n' ' ')
          [ "$(printf '%s' "$revs" | wc -w | tr -d ' ')" -eq 2 ] || { echo "❌ dd-init.md 裡的 dd-loop-rev 不只一種（或一個都沒有）：${revs}"; fail=1; }
          [ $fail -eq 0 ] && echo "✅ 四方一致，版本標記與 dd-loop-rev 都對得上"
          exit $fail

      - name: 迴圈步數第五方（安裝腳本輸出字串 ↔ 一行式箭頭摘要）
        run: |
          # 四方檢查只數「編號清單」，使用者實際看到的兩類文案不在其中：
          # ①install-dd-pipeline.sh 印出的「N 步開發迴圈」②散落各處的一行式箭頭摘要。
          # 2026-09-04 這兩類共漏抓 9 處（含 DD_PIPELINE_ARCHITECTURE.md 停在 7 段）。
          n=$(sed -n '/^### 3\.9/,/^> 步驟 1/p' templates/global/CLAUDE.md | grep -cE '^[0-9]+\. ')
          echo "基準（全域模板 §3.9）：$n 步"
          [ "$n" -gt 0 ] || { echo "❌ 基準抓不到步驟，區塊 regex 失效"; exit 1; }
          fail=0

          # ① 安裝腳本印給使用者的字串（排除註解行 — 那裡是有日期的歷史敘述，刻意保留舊數字）
          found=0
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            found=1; ln="${hit%%:*}"
            got=$(printf '%s' "$hit" | grep -oE '[0-9]+ 步開發迴圈' | grep -oE '^[0-9]+' | head -1)
            if [ "$got" = "$n" ]; then echo "✅ install-dd-pipeline.sh:${ln} 輸出 $got 步"
            else echo "❌ install-dd-pipeline.sh:${ln} 印出 $got 步，應為 $n 步"; fail=1; fi
          done < <(grep -nE '[0-9]+ 步開發迴圈' install-dd-pipeline.sh | grep -vE '^[0-9]+:[[:space:]]*#' || true)
          [ "$found" = 1 ] || { echo "❌ 腳本裡找不到任何「N 步開發迴圈」輸出，抓取 regex 已失效"; fail=1; }

          # ② 一行式箭頭摘要：合併續行後，箭頭≥3 且同時含 commit 與 review 才認定為迴圈摘要
          #    CHANGELOG / UPGRADING 是歷史敘述，排除
          found=0
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            found=1; where="${hit%%|*}"; got="${hit##*|}"
            if [ "$got" = "$n" ]; then echo "✅ 箭頭摘要 ${where}：$got 段"
            else echo "❌ ${where} 的箭頭摘要是 $got 段，應為 $n 段"; fail=1; fi
          done < <(git ls-files '*.md' '*.sh' | grep -vE '^(CHANGELOG|UPGRADING)\.md$' \
            | while IFS= read -r f; do
                awk -v F="$f" '
                  function flush(  c) {
                    if (buf == "") return
                    c = gsub(/→/, "→", buf)
                    if (c >= 3 && buf ~ /commit/ && buf ~ /review|審查/) printf "%s:%d|%d\n", F, ln, c+1
                    buf = ""
                  }
                  { line = $0
                    if (line ~ /^[[:space:]]*→/ && buf != "") { sub(/^[[:space:]]+/, "", line); buf = buf " " line; next }
                    flush(); buf = line; ln = NR }
                  END { flush() }' "$f"
              done || true)
          [ "$found" = 1 ] || { echo "❌ 找不到任何箭頭摘要，抓取規則已失效"; fail=1; }

          [ $fail -eq 0 ] && echo "✅ 兩類文案都與 $n 步一致"
          exit $fail

      # 情境本體在 tests/test-gate.sh（2026-10-01 從這裡搬出去，macOS 那個 job 才能共用同一份）
      - name: gate 段落起點（SKIP 跳過的目錄，之後的正常 commit 要補上 CLAUDE.md）
        run: tests/test-gate.sh

      # 情境本體在 tests/test-install.sh（2026-10-01 從這裡搬出去，macOS 那個 job 才能共用同一份）
      - name: Sandbox 端到端安裝測試（非互動）
        run: tests/test-install.sh

  # scripts/CLAUDE.md 要求腳本能在 macOS 內建的 bash 3.2 執行，但上面那個 job 只跑 ubuntu（bash 5），
  # 3.2 不支援的寫法（${x,,}、declare -A、mapfile…）在那裡照樣全綠。這個 job 用 macOS 的 /bin/bash
  # 實跑同一批行為測試與安裝端到端測試。公開 repo 的 macOS runner 不計費
  bash32:
    name: macOS bash 3.2 行為測試
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 這個 job 存在的理由就是驗 3.2：/bin/bash 哪天不是 3.2 了，後面全綠也不代表驗過
      - name: 確認 /bin/bash 是 3.2
        run: |
          v=$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "/bin/bash = ${v}"
          [ "$v" = "3.2" ] || { echo "❌ /bin/bash 不是 3.2，這個 job 驗不到它要驗的東西"; exit 1; }

      # 測試腳本一律用 /bin/bash 明確呼叫（run: 的預設 shell 可能是 Homebrew 的新版 bash）；
      # 被測的 hook 與 gate 靠 shebang #!/bin/bash 執行，同樣是 3.2
      - name: error-capture hook 行為測試
        run: /bin/bash skills/self-improving-agent/hooks/test-error-capture.sh

      - name: gate-guard hook 行為測試
        run: /bin/bash skills/gate-guard/hooks/test-guard-no-verify.sh

      - name: gate 情境測試
        run: /bin/bash tests/test-gate.sh

      # 每個 macOS 使用者真正會跑的部署路徑（首次安裝、冪等、--force、--uninstall…）
      - name: Sandbox 端到端安裝測試（非互動）
        run: /bin/bash tests/test-install.sh
