name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 安裝腳本檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 語法檢查
        run: bash -n install-dd-pipeline.sh

      - name: ShellCheck（error 級）
        run: shellcheck -S error install-dd-pipeline.sh

      - name: help smoke test
        run: ./install-dd-pipeline.sh --help

      - name: Skill hook 路徑驗證
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          bash -c 'source /tmp/inst.sh && validate_skill_hooks'

      - name: 陣列與目錄一致性（ALL_* = 三桶聯集）
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          bash -c '
            source /tmp/inst.sh
            fail=0
            check() {
              local label="$1" expected="$2" actual="$3"
              if ! diff <(echo "$expected") <(echo "$actual"); then
                echo "❌ ${label}：陣列與實際目錄不一致（< 陣列 / > 目錄）"
                fail=1
              else
                echo "✅ $label 一致"
              fi
            }
            check "ALL_SKILLS" \
              "$(printf "%s\n" "${ALL_SKILLS[@]}" | sort)" \
              "$(ls -d skills/*/ | xargs -n1 basename | sort)"
            check "ALL_AGENTS" \
              "$(printf "%s\n" "${ALL_AGENTS[@]}" | sort)" \
              "$(ls agents/*.md | xargs -n1 basename | sed "s/\.md$//" | sort)"
            check "ALL_DD_COMMANDS" \
              "$(printf "%s\n" "${ALL_DD_COMMANDS[@]}" | sort)" \
              "$(ls commands/dd-*.md | xargs -n1 basename | sed "s/\.md$//" | sort)"
            check "ALL_NS_COMMANDS" \
              "$(printf "%s\n" "${ALL_NS_COMMANDS[@]}" | sort)" \
              "$(ls -d commands/*/ | xargs -n1 basename | sort)"
            check "DD_TEMPLATES" \
              "$(printf "%s\n" "${DD_TEMPLATES[@]}" | sort)" \
              "$(ls templates/*.template | xargs -n1 basename | sort)"
            exit $fail
          '

      - name: 分桶數字宣稱一致性（README / CLAUDE.md ↔ 腳本陣列）
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          bash -c '
            source /tmp/inst.sh
            fail=0
            ck() {
              local label="$1" claimed="$2" actual="$3"
              if [ -n "$claimed" ] && [ "$claimed" = "$actual" ]; then
                echo "✅ ${label}：${actual}"
              else
                echo "❌ ${label}：宣稱「${claimed:-未找到}」，實際 ${actual}"
                fail=1
              fi
            }

            # README 安裝章節
            ck "README 安裝 promoted skills 數" \
              "$(grep -oE "安裝 [0-9]+ 個 promoted Skills" README.md | grep -oE "[0-9]+")" \
              "${#PROMOTED_SKILLS[@]}"
            ck "README 安裝 promoted agents 數" \
              "$(grep -oE "安裝 [0-9]+ 個 promoted Agents" README.md | grep -oE "[0-9]+")" \
              "${#PROMOTED_AGENTS[@]}"

            # README Promoted Skills 章節：標題數字 + 表格內容
            ck "README Promoted Skills 標題數" \
              "$(grep -oE "^## Promoted Skills（預設部署，[0-9]+ 個）" README.md | grep -oE "[0-9]+")" \
              "${#PROMOTED_SKILLS[@]}"
            tbl=$(awk "/^## Promoted Skills/{f=1;next} f&&/^## /{exit} f" README.md \
              | awk -F"|" "/^\| [a-z]/{gsub(/ /,\"\",\$2); print \$2}" | sort)
            if ! diff <(printf "%s\n" "${PROMOTED_SKILLS[@]}" | sort) <(echo "$tbl"); then
              echo "❌ README Promoted Skills 表格與 PROMOTED_SKILLS 陣列不一致（< 陣列 / > 表格）"
              fail=1
            else
              echo "✅ README Promoted Skills 表格一致"
            fi

            # README 升級指南 --prune 宣稱（misc+deprecated 會被清的數量）
            read -r ps pa pd pn <<<"$(grep -oE "（[0-9]+ skills / [0-9]+ agents / [0-9]+ dd 指令 / [0-9]+ NS commands）" README.md \
              | grep -oE "[0-9]+" | tr "\n" " ")"
            ck "README --prune skills 數" "$ps" "$(( ${#MISC_SKILLS[@]} + ${#DEPRECATED_SKILLS[@]} ))"
            ck "README --prune agents 數" "$pa" "${#DEPRECATED_AGENTS[@]}"
            ck "README --prune dd 指令數" "$pd" "${#DEPRECATED_DD_COMMANDS[@]}"
            ck "README --prune NS commands 數" "$pn" "$(( ${#MISC_NS_COMMANDS[@]} + ${#DEPRECATED_NS_COMMANDS[@]} ))"

            # 專案 CLAUDE.md 目錄結構數字
            ck "CLAUDE.md skills 總數" \
              "$(grep -oE "skills/\` — [0-9]+ 個 Skills" CLAUDE.md | grep -oE "[0-9]+")" \
              "${#ALL_SKILLS[@]}"
            ck "CLAUDE.md agents 總數" \
              "$(grep -oE "agents/\` — [0-9]+ 個 Agents" CLAUDE.md | grep -oE "[0-9]+")" \
              "${#ALL_AGENTS[@]}"
            ck "CLAUDE.md dd 指令總數" \
              "$(grep -oE "[0-9]+ 個 dd-\* 指令" CLAUDE.md | grep -oE "^[0-9]+")" \
              "${#ALL_DD_COMMANDS[@]}"
            ck "CLAUDE.md NS command 總數" \
              "$(grep -oE "[0-9]+ 個命名空間 command 目錄" CLAUDE.md | grep -oE "^[0-9]+")" \
              "${#ALL_NS_COMMANDS[@]}"
            ck "CLAUDE.md 模板數" \
              "$(grep -oE "[0-9]+ 個文件模板" CLAUDE.md | grep -oE "^[0-9]+")" \
              "${#DD_TEMPLATES[@]}"
            exit $fail
          '

      - name: 全域模板 §7.2 觸發目標存在性
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          source /tmp/inst.sh
          fail=0
          targets=$(awk '/^### 7\.2/,/^### 7\.3/' templates/global/CLAUDE.md \
            | awk -F'|' '/^\|/{print $3}' | grep -oE '`[^`]+`' | tr -d '`' | sort -u)
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            base="${t##*:}"; ns="${t%%:*}"
            if [ -d "skills/$base" ] || [ -f "agents/$base.md" ]; then
              echo "✅ $t"
            elif [ "$t" != "$base" ] && printf '%s\n' "${OFFICIAL_PLUGINS[@]}" | grep -qx "$ns"; then
              echo "✅ ${t}（官方 plugin，install_plugins 會安裝）"
            else
              echo "❌ §7.2 觸發目標不存在：$t"; fail=1
            fi
          done <<< "$targets"
          exit $fail
