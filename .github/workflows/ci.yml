name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 安裝腳本檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 語法檢查
        run: bash -n install-dd-pipeline.sh

      - name: ShellCheck（warning 級，全部 shell 腳本）
        run: |
          shellcheck -S warning \
            install-dd-pipeline.sh \
            scripts/check-claude-md.sh \
            scripts/githooks/pre-commit \
            skills/self-improving-agent/hooks/error-capture.sh

      - name: help smoke test
        run: ./install-dd-pipeline.sh --help

      - name: Skill hook 路徑驗證
        run: |
          source ./install-dd-pipeline.sh
          validate_skill_hooks

      - name: 陣列與目錄一致性（ALL_* = 部署清單）
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          check() {
            local label="$1" expected="$2" actual="$3"
            if ! diff <(echo "$expected") <(echo "$actual"); then
              echo "❌ ${label}：陣列與實際目錄不一致（< 陣列 / > 目錄）"
              fail=1
            else
              echo "✅ $label 一致"
            fi
          }
          check "ALL_SKILLS" \
            "$(printf "%s\n" "${ALL_SKILLS[@]}" | sort)" \
            "$(ls -d skills/*/ | xargs -n1 basename | sort)"
          check "ALL_AGENTS" \
            "$(printf "%s\n" "${ALL_AGENTS[@]}" | sort)" \
            "$(ls agents/*.md | xargs -n1 basename | sed 's/\.md$//' | sort)"
          check "ALL_DD_COMMANDS" \
            "$(printf "%s\n" "${ALL_DD_COMMANDS[@]}" | sort)" \
            "$(ls commands/dd-*.md | xargs -n1 basename | sed 's/\.md$//' | sort)"
          check "ALL_NS_COMMANDS" \
            "$(printf "%s\n" "${ALL_NS_COMMANDS[@]}" | sort)" \
            "$(ls -d commands/*/ | xargs -n1 basename | sort)"
          # scripts/ 是後果最嚴重的一類（gate 腳本在這層），卻是最晚補上檢查的：
          # 忘了加進 DD_SCRIPTS 時 create_scripts() 不會部署它，使用者機器上 ~/.claude/scripts/
          # 根本沒有那支腳本，而 repo 裡檔案在、CI 全綠，只有到別人的機器上才會炸。
          # githooks/ 不部署，本來就不在 scripts/*.sh 這個 glob 內
          check "DD_SCRIPTS" \
            "$(printf "%s\n" "${DD_SCRIPTS[@]}" | sort)" \
            "$(ls scripts/*.sh | xargs -n1 basename | sort)"
          exit $fail

      - name: 數字宣稱一致性（README / CLAUDE.md ↔ 腳本陣列）
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          ck() {
            local label="$1" claimed="$2" actual="$3"
            if [ -n "$claimed" ] && [ "$claimed" = "$actual" ]; then
              echo "✅ ${label}：${actual}"
            else
              echo "❌ ${label}：宣稱「${claimed:-未找到}」，實際 ${actual}"
              fail=1
            fi
          }

          # README（英文預設 + 繁中）：安裝章節數字、Promoted Skills 標題數字與表格內容
          # 正規式刻意做成語言無關 —「10 個 promoted Skills」與「10 promoted Skills」都吃，
          # 兩份都驗，否則沒被驗的那份會靜靜過期
          for rf in README.md README.zh-TW.md; do
            [ -f "$rf" ] || { echo "❌ 找不到 $rf"; fail=1; continue; }

            ck "${rf} 安裝 promoted skills 數" \
              "$(grep -oE "[0-9]+( 個)? promoted Skills" "$rf" | grep -oE "^[0-9]+" | head -1)" \
              "${#PROMOTED_SKILLS[@]}"
            ck "${rf} 安裝 promoted agents 數" \
              "$(grep -oE "[0-9]+( 個)? promoted Agents" "$rf" | grep -oE "^[0-9]+" | head -1)" \
              "${#PROMOTED_AGENTS[@]}"

            ck "${rf} Promoted Skills 標題數" \
              "$(grep -oE "^## Promoted Skills[^0-9]*[0-9]+" "$rf" | grep -oE "[0-9]+$" | head -1)" \
              "${#PROMOTED_SKILLS[@]}"
            tbl=$(awk '/^## Promoted Skills/{f=1;next} f&&/^## /{exit} f' "$rf" \
              | awk -F'|' '/^\| [a-z]/{gsub(/ /,"",$2); print $2}' | sort)
            if ! diff <(printf "%s\n" "${PROMOTED_SKILLS[@]}" | sort) <(echo "$tbl"); then
              echo "❌ ${rf} Promoted Skills 表格與 PROMOTED_SKILLS 陣列不一致（< 陣列 / > 表格）"
              fail=1
            else
              echo "✅ ${rf} Promoted Skills 表格一致"
            fi
          done

          # 專案 CLAUDE.md 目錄結構數字
          ck "CLAUDE.md skills 總數" \
            "$(grep -oE "skills/\` — [0-9]+ 個 Skills" CLAUDE.md | grep -oE "[0-9]+")" \
            "${#ALL_SKILLS[@]}"
          ck "CLAUDE.md agents 總數" \
            "$(grep -oE "agents/\` — [0-9]+ 個 Agents" CLAUDE.md | grep -oE "[0-9]+")" \
            "${#ALL_AGENTS[@]}"
          ck "CLAUDE.md dd 指令總數" \
            "$(grep -oE "[0-9]+ 個 dd-\* 指令" CLAUDE.md | grep -oE "^[0-9]+")" \
            "${#ALL_DD_COMMANDS[@]}"
          ck "CLAUDE.md NS command 總數" \
            "$(grep -oE "[0-9]+ 個命名空間 command 目錄" CLAUDE.md | grep -oE "^[0-9]+")" \
            "${#ALL_NS_COMMANDS[@]}"
          exit $fail

      - name: 安裝 flag 三方對照（README ↔ --help ↔ 腳本 case 分支）
        run: |
          fail=0
          # 腳本實際支援的 flag：頂層參數解析的 case 分支
          script_flags=$(grep -oE '^[[:space:]]+--[a-z-]+\)' install-dd-pipeline.sh \
            | tr -d ' )' | sort -u)
          # --help 印出的選項清單
          help_flags=$(./install-dd-pipeline.sh --help \
            | grep -oE '^[[:space:]]+--[a-z-]+' | tr -d ' ' | sort -u)
          # 兩份 README 的指令範例：只取 ./install-dd-pipeline.sh 後面接的 flag，
          # 否則會誤抓別的指令的參數（README 有 `claude mcp add --scope user`）
          readme_flags=$(grep -hoE '\./install-dd-pipeline\.sh( --[a-z-]+)+' README.md README.zh-TW.md \
            | grep -oE -- '--[a-z-]+' | sort -u)

          cmp_flags() {
            local label="$1" a="$2" b="$3"
            if diff <(echo "$a") <(echo "$b"); then
              echo "✅ ${label} 一致"
            else
              echo "❌ ${label} 不一致（< 前者 / > 後者）"
              fail=1
            fi
          }
          cmp_flags "腳本 case 分支 ↔ --help 輸出" "$script_flags" "$help_flags"
          cmp_flags "腳本 case 分支 ↔ README 指令範例" "$script_flags" "$readme_flags"
          exit $fail

      - name: 全域模板 §7.2 觸發目標存在性與部署
        run: |
          source ./install-dd-pipeline.sh
          fail=0
          # Claude Code 內建 skill 白名單：§7.2 可指向、但不由本 repo 部署的目標
          BUILTIN_CC_SKILLS="claude-api"
          targets=$(awk '/^### 7\.2/,/^### 7\.3/' templates/global/CLAUDE.md \
            | awk -F'|' '/^\|/{print $3}' | grep -oE '`[^`]+`' | tr -d '`' | sort -u)
          # 護欄一：抓不到就是 regex 失效（§7 重新編號、標題改寫、表格改格式都會踩到）。
          # 沒有這道護欄時 while 迴圈一次都不跑、印綠燈，這個 step 的職責等於整個消失
          [ -n "$targets" ] || { echo "❌ §7.2 表格抓不到任何觸發目標，awk 範圍 regex 已失效"; exit 1; }
          # 護欄二：資料列數 ↔ 有反引號的列數。單獨一列掉了反引號會被 grep 靜靜略過，
          # 那一列的目標從此不受檢查（不能拿 targets 筆數來比 — 它是 sort -u 過的）
          rows=$(awk '/^### 7\.2/,/^### 7\.3/' templates/global/CLAUDE.md | awk -F'|' '/^\|/{print $3}')
          n_rows=$(printf '%s\n' "$rows" | awk '{gsub(/^[ \t]+|[ \t]+$/,"")} $0!="" && $0!="呼叫" && $0!~/^-+$/' | grep -c .)
          n_ticked=$(printf '%s\n' "$rows" | grep -c '`')
          [ "$n_rows" = "$n_ticked" ] || { echo "❌ §7.2 有 $((n_rows - n_ticked)) 列的目標沒用反引號包住，會被靜靜略過"; exit 1; }
          echo "（§7.2 資料列 $n_rows 列，全部有反引號）"
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            base="${t##*:}"; ns="${t%%:*}"
            if printf '%s\n' "${PROMOTED_SKILLS[@]}" | grep -qx "$base" && [ -d "skills/$base" ]; then
              echo "✅ ${t}（promoted skill）"
            elif printf '%s\n' "${PROMOTED_AGENTS[@]}" | grep -qx "$base" && [ -f "agents/$base.md" ]; then
              echo "✅ ${t}（promoted agent）"
            elif [ "$t" != "$base" ] && printf '%s\n' "${OFFICIAL_PLUGINS[@]}" | grep -qx "$ns"; then
              echo "✅ ${t}（官方 plugin，install_plugins 會安裝）"
            elif printf '%s\n' "$BUILTIN_CC_SKILLS" | grep -qx "$base"; then
              echo "✅ ${t}（Claude Code 內建 skill）"
            else
              echo "❌ §7.2 觸發目標未預設部署（不在部署清單 / 官方 plugin / 內建白名單）：$t"; fail=1
            fi
          done <<< "$targets"
          exit $fail

      - name: 迴圈步數四方一致（全域模板 ↔ dd-init 蓋章版 ↔ 兩份 README ↔ 版本標記）
        run: |
          # 2026-08-31 迴圈 6→7→8 時，README 清單漏補一項、dd-loop-version 停在 6step，
          # 兩者都不會報錯只會靜默失效（舊專案跑 /dd-init 會被判定「已是最新」）
          count_block() {  # $1=檔案 $2=區塊起始 regex $3=區塊結束 regex
            sed -n "/$2/,/$3/p" "$1" | grep -cE '^[0-9]+\. '
          }
          count_fence() {  # $1=檔案 $2=章節標題 regex：數該章節第一個 ``` 圍欄內的編號項
            awk -v pat="$2" '$0 ~ pat {f=1} f&&/^```$/{c++; if(c==2)f=0} f&&c==1&&/^[0-9]+\./{n++} END{print n+0}' "$1"
          }
          n_tpl=$(count_block templates/global/CLAUDE.md '^### 3\.9' '^> 步驟 1')
          n_dd=$(count_block commands/dd-init.md '^## 開發流程' '^驗證不過')
          n_en=$(count_fence README.md '^## The core loop')
          n_zh=$(count_fence README.zh-TW.md '^## 核心工作法')
          tag=$(grep -o 'dd-loop-version: [0-9a-z]*' commands/dd-init.md | head -1 | awk '{print $2}')
          echo "全域模板 §3.9=$n_tpl  dd-init 蓋章版=$n_dd  README.md=$n_en  README.zh-TW=$n_zh  標記=$tag"
          fail=0
          [ "$n_tpl" -gt 0 ] || { echo "❌ 全域模板 §3.9 抓不到步驟，檢查腳本的區塊 regex 失效"; fail=1; }
          for pair in "dd-init:$n_dd" "README.md:$n_en" "README.zh-TW.md:$n_zh"; do
            name="${pair%%:*}"; got="${pair##*:}"
            [ "$got" = "$n_tpl" ] || { echo "❌ $name 是 $got 步，與全域模板 §3.9 的 $n_tpl 步不一致"; fail=1; }
          done
          [ "$tag" = "${n_tpl}step" ] || { echo "❌ dd-loop-version 是 ${tag}，應為 ${n_tpl}step — 標記過期會讓 /dd-init 誤判舊專案已是最新"; fail=1; }
          # dd-loop-rev（同一個步數裡的修訂版）：蓋章標記與 Phase 1 偵測文字只改一邊時，
          # 會把剛蓋章的專案判成舊版、或把舊專案判成最新，兩種都不報錯
          if ! grep -qE '^<!-- dd-loop-version: [0-9a-z]+；dd-loop-rev: [0-9]+；' commands/dd-init.md; then
            echo "❌ dd-init 蓋章版標記抓不到 dd-loop-rev（標記格式改了的話，這裡的 regex 要跟著改）"; fail=1
          fi
          revs=$(grep -oE 'dd-loop-rev: [0-9]+' commands/dd-init.md | sort -u | tr '\n' ' ')
          [ "$(printf '%s' "$revs" | wc -w | tr -d ' ')" -eq 2 ] || { echo "❌ dd-init.md 裡的 dd-loop-rev 不只一種（或一個都沒有）：${revs}"; fail=1; }
          [ $fail -eq 0 ] && echo "✅ 四方一致，版本標記與 dd-loop-rev 都對得上"
          exit $fail

      - name: 迴圈步數第五方（安裝腳本輸出字串 ↔ 一行式箭頭摘要）
        run: |
          # 四方檢查只數「編號清單」，使用者實際看到的兩類文案不在其中：
          # ①install-dd-pipeline.sh 印出的「N 步開發迴圈」②散落各處的一行式箭頭摘要。
          # 2026-09-04 這兩類共漏抓 9 處（含 DD_PIPELINE_ARCHITECTURE.md 停在 7 段）。
          n=$(sed -n '/^### 3\.9/,/^> 步驟 1/p' templates/global/CLAUDE.md | grep -cE '^[0-9]+\. ')
          echo "基準（全域模板 §3.9）：$n 步"
          [ "$n" -gt 0 ] || { echo "❌ 基準抓不到步驟，區塊 regex 失效"; exit 1; }
          fail=0

          # ① 安裝腳本印給使用者的字串（排除註解行 — 那裡是有日期的歷史敘述，刻意保留舊數字）
          found=0
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            found=1; ln="${hit%%:*}"
            got=$(printf '%s' "$hit" | grep -oE '[0-9]+ 步開發迴圈' | grep -oE '^[0-9]+' | head -1)
            if [ "$got" = "$n" ]; then echo "✅ install-dd-pipeline.sh:${ln} 輸出 $got 步"
            else echo "❌ install-dd-pipeline.sh:${ln} 印出 $got 步，應為 $n 步"; fail=1; fi
          done < <(grep -nE '[0-9]+ 步開發迴圈' install-dd-pipeline.sh | grep -vE '^[0-9]+:[[:space:]]*#' || true)
          [ "$found" = 1 ] || { echo "❌ 腳本裡找不到任何「N 步開發迴圈」輸出，抓取 regex 已失效"; fail=1; }

          # ② 一行式箭頭摘要：合併續行後，箭頭≥3 且同時含 commit 與 review 才認定為迴圈摘要
          #    CHANGELOG / UPGRADING 是歷史敘述，排除
          found=0
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            found=1; where="${hit%%|*}"; got="${hit##*|}"
            if [ "$got" = "$n" ]; then echo "✅ 箭頭摘要 ${where}：$got 段"
            else echo "❌ ${where} 的箭頭摘要是 $got 段，應為 $n 段"; fail=1; fi
          done < <(git ls-files '*.md' '*.sh' | grep -vE '^(CHANGELOG|UPGRADING)\.md$' \
            | while IFS= read -r f; do
                awk -v F="$f" '
                  function flush(  c) {
                    if (buf == "") return
                    c = gsub(/→/, "→", buf)
                    if (c >= 3 && buf ~ /commit/ && buf ~ /review|審查/) printf "%s:%d|%d\n", F, ln, c+1
                    buf = ""
                  }
                  { line = $0
                    if (line ~ /^[[:space:]]*→/ && buf != "") { sub(/^[[:space:]]+/, "", line); buf = buf " " line; next }
                    flush(); buf = line; ln = NR }
                  END { flush() }' "$f"
              done || true)
          [ "$found" = 1 ] || { echo "❌ 找不到任何箭頭摘要，抓取規則已失效"; fail=1; }

          [ $fail -eq 0 ] && echo "✅ 兩類文案都與 $n 步一致"
          exit $fail

      - name: gate 段落起點（SKIP 跳過的目錄，之後的正常 commit 要補上 CLAUDE.md）
        run: |
          # 2026-09-11 修的漏洞：gate 原本只看「這次 commit」staged 的檔案。rental-line 段落 1
          # 第一個 commit 用 SKIP 建了 4 個沒有 CLAUDE.md 的程式碼目錄，最後一個 commit 沒改
          # 程式碼，gate 就放行了。現在記段落起點，正常 commit 時把起點以來欠的目錄一起查
          GATE="$PWD/scripts/check-claude-md.sh"
          OUT="$(mktemp)"
          cd "$(mktemp -d)"
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          printf '#!/bin/sh\nexec "%s"\n' "$GATE" > .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          BASE_FILE="$(git rev-parse --git-path dd-segment-base)"
          fail=0
          expect() {  # $1=說明 $2=預期（pass / block） 其餘=指令
            desc="$1"; want="$2"; shift 2
            if "$@" > "$OUT" 2>&1; then got=pass; else got=block; fi
            if [ "$got" = "$want" ]; then
              echo "✅ $desc"
            else
              echo "❌ ${desc}：預期 ${want}，實際 ${got}"; sed 's/^/    /' "$OUT"; fail=1
            fi
          }
          commit() { git add -A && git commit -qm "$1"; }
          skip_commit() { git add -A && SKIP_DOC_CHECK=1 git commit -qm "$1"; }
          said() { grep -qF "$1" "$OUT" || { echo "❌ 輸出沒提到：$1"; sed 's/^/    /' "$OUT"; fail=1; }; }
          base_is() { [ "$(cat "$BASE_FILE" 2>/dev/null)" = "$1" ] || { echo "❌ 起點應為 ${1}，實際是 $(cat "$BASE_FILE" 2>/dev/null)"; fail=1; }; }

          # 1. rental-line 段落 1：起點在第一個 commit 之前（還沒有 HEAD）
          expect "還沒有 HEAD 也能記起點" pass "$GATE" --start-segment
          base_is "$(git hash-object -t tree /dev/null)"
          mkdir src && echo a > src/a.js
          expect "SKIP 的檢查點 commit 放行" pass skip_commit c1
          echo readme > README.md
          expect "之後只改 README 的正常 commit 要擋（src 欠 CLAUDE.md）" block commit c2
          said "src/CLAUDE.md"
          echo doc > src/CLAUDE.md
          expect "補上 src/CLAUDE.md 就放行" pass commit c3
          echo more >> README.md
          expect "欠的補完，之後不再追討" pass commit c4

          # 2. 有欠帳時不准重記起點（起點往後移會把欠帳洗掉）
          expect "沒有欠帳時可以重記起點" pass "$GATE" --start-segment
          base_is "$(git rev-parse HEAD)"
          echo b > src/b.js
          expect "SKIP 改 src/b.js（起點不動）" pass skip_commit c5
          base_is "$(git rev-parse HEAD~1)"
          expect "有欠帳時拒絕重記起點" block "$GATE" --start-segment
          said "先補完再記新起點"
          base_is "$(git rev-parse HEAD~1)"
          echo doc2 >> src/CLAUDE.md
          expect "補完放行" pass commit c6

          # 3. 起點再舊也不能變寬鬆：舊的 CLAUDE.md 更新抵不掉之後才 SKIP 的程式碼
          echo c > src/c.js && echo doc3 >> src/CLAUDE.md
          expect "X：程式碼和 CLAUDE.md 一起 commit" pass commit x
          echo d > src/d.js
          expect "Y：SKIP 只改程式碼" pass skip_commit y
          echo z >> README.md
          expect "Z：只改 README 也要擋（Y 欠的帳）" block commit z
          said "src/CLAUDE.md"
          echo doc4 >> src/CLAUDE.md
          expect "補上放行" pass commit z2

          # 4. 沒 SKIP 的 commit 規則不變：改到的目錄這次就要一起 staged CLAUDE.md
          echo e >> src/a.js
          expect "起點之後更新過 CLAUDE.md，這次沒 staged 仍要擋" block commit n1
          said "未一起 staged"
          echo doc5 >> src/CLAUDE.md
          expect "同批補上放行" pass commit n2

          # 5. --segment-base：有起點就印；沒有就失敗，不能印空字串給 git diff 吃
          expect "有起點時印得出來" pass "$GATE" --segment-base
          said "$(cat "$BASE_FILE" 2>/dev/null || echo 沒有起點檔)"
          rm -f "$BASE_FILE"
          expect "沒有起點時要失敗" block "$GATE" --segment-base

          # 6. 忘了記起點：第一個 SKIP 自動記下；之後再 SKIP，起點也不動
          echo f > src/f.js
          expect "沒記起點直接 SKIP" pass skip_commit auto1
          [ -f "$BASE_FILE" ] || { echo "❌ SKIP 沒有自動記下起點"; fail=1; }
          said "$(cat "$BASE_FILE" 2>/dev/null || echo 沒有起點檔)"
          mkdir p && echo 1 > p/x.js
          expect "再 SKIP p/x.js（起點不動）" pass skip_commit auto2
          base_is "$(git rev-parse HEAD~2)"
          echo r >> README.md
          expect "兩個 SKIP 欠的目錄都要擋" block commit auto3
          said "src/CLAUDE.md"
          said "p/CLAUDE.md"
          echo doc6 >> src/CLAUDE.md && echo pdoc > p/CLAUDE.md
          expect "補上放行" pass commit auto4

          # 7. 起點被改寫、不在目前分支的歷史裡：改從共同祖先算，欠帳不能跟著消失
          expect "重記起點" pass "$GATE" --start-segment
          git checkout -qb br-rewritten && echo s > side.txt
          expect "另一條線上的 commit（模擬被改寫的起點）" pass commit side
          side=$(git rev-parse HEAD)
          git checkout -q -
          mkdir r && echo 1 > r/a.js
          expect "SKIP r/a.js" pass skip_commit r1
          echo "$side" > "$BASE_FILE"
          expect "起點失效時 --segment-base 要失敗" block "$GATE" --segment-base
          echo q >> README.md
          expect "起點失效：從共同祖先算，照樣擋 r 欠的帳" block commit w1
          said "不在目前分支的歷史裡"
          said "r/CLAUDE.md"
          expect "起點失效也不准重記起點把欠帳洗掉" block "$GATE" --start-segment
          echo rdoc > r/CLAUDE.md
          expect "補上放行" pass commit w2
          mkdir w && echo 1 > w/a.js
          expect "staged 的程式碼目錄照查" block commit w3
          said "w/CLAUDE.md"
          echo wdoc > w/CLAUDE.md
          expect "同批補上放行" pass commit w4

          # 8. 欠帳的目錄後來沒有程式碼了：沒東西要補。看的是 index，只在工作目錄刪掉不算
          expect "重記起點（取代失效的起點）" pass "$GATE" --start-segment
          mkdir gone && echo g > gone/g.js
          expect "SKIP 建 gone/g.js（沒有 CLAUDE.md）" pass skip_commit g1
          git rm -rq gone
          expect "刪掉整個 gone/ 的正常 commit 放行" pass commit g2
          expect "目錄已刪，重記起點不再拒絕" pass "$GATE" --start-segment
          mkdir mv && echo m > mv/m.js && echo '{}' > mv/data.json
          expect "SKIP 建 mv/m.js" pass skip_commit mv1
          git mv mv/m.js src/m.js && echo doc7 >> src/CLAUDE.md
          expect "程式碼搬進 src（同批更新 src/CLAUDE.md），mv 只剩 data.json：放行" pass commit mv2
          mkdir keep && echo k > keep/k.js
          expect "SKIP 建 keep/k.js" pass skip_commit k1
          rm -rf keep && echo k >> README.md && git add README.md
          expect "只在工作目錄刪掉、沒 staged：commit 裡還有 keep/k.js，要擋" block git commit -qm k2
          said "keep/CLAUDE.md"
          git checkout -- keep
          echo kdoc > keep/CLAUDE.md
          expect "補上放行" pass commit k3

          # 9. merge：平行分支上看不到那段程式碼的 CLAUDE.md 更新不算補上；merge commit 自己補的算
          expect "重記起點" pass "$GATE" --start-segment
          git checkout -qb br-feat
          mkdir feat && echo f > feat/a.js
          export GIT_AUTHOR_DATE=2030-01-01T00:00:00 GIT_COMMITTER_DATE=2030-01-01T00:00:00
          expect "br-feat 上 SKIP 建 feat/a.js（日期較早）" pass skip_commit f1
          git checkout -q -
          mkdir -p feat && echo fdoc > feat/CLAUDE.md
          export GIT_AUTHOR_DATE=2030-01-02T00:00:00 GIT_COMMITTER_DATE=2030-01-02T00:00:00
          expect "主線先建 feat/CLAUDE.md（看不到 feat/a.js，日期較晚）" pass commit m1
          unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE
          git merge -q --no-edit br-feat
          echo mm >> README.md
          expect "merge 後的正常 commit 要擋：主線那份 CLAUDE.md 沒看過 feat/a.js" block commit m2
          said "feat/CLAUDE.md"
          echo fdoc2 >> feat/CLAUDE.md
          expect "補上放行" pass commit m3
          git checkout -qb br-feat2
          mkdir feat2 && echo f > feat2/a.js
          expect "br-feat2 上 SKIP 建 feat2/a.js" pass skip_commit f2
          git checkout -q -
          git merge -q --no-commit --no-ff br-feat2
          echo f2doc > feat2/CLAUDE.md && git add feat2/CLAUDE.md
          expect "merge commit 自己補上 feat2/CLAUDE.md：放行" pass git commit -qm merge2
          echo y >> README.md
          expect "之後不再追討 feat2" pass commit after2

          # 10. 非 ASCII 路徑也要查（git 預設把中文路徑加引號跳脫，原本比對不到副檔名）
          mkdir 功能 && echo 1 > 功能/a.js
          expect "staged 中文目錄的程式碼、沒有 CLAUDE.md：要擋" block commit u1
          said "功能/CLAUDE.md"
          echo doc > 功能/CLAUDE.md
          expect "補上放行" pass commit u2
          mkdir 模組 && echo 1 > 模組/b.js
          expect "SKIP 中文目錄的程式碼" pass skip_commit u3
          echo u >> README.md
          expect "之後的正常 commit 要擋 模組/CLAUDE.md" block commit u4
          said "模組/CLAUDE.md"
          echo doc > 模組/CLAUDE.md
          expect "補上放行" pass commit u5

          # 11. 根目錄的程式碼（路徑沒有斜線，目錄算成「.」）和含空白的目錄名也要查
          echo 1 > top.js && mkdir "my dir" && echo 1 > "my dir/a.js"
          expect "SKIP 根目錄與含空白目錄的程式碼" pass skip_commit t1
          echo t >> README.md
          expect "之後的正常 commit 要擋這兩個目錄" block commit t2
          # 整行比對：根目錄這時還沒有 CLAUDE.md，要列在「缺少」清單；said 是子字串比對，「  CLAUDE.md（」開頭的行也會中
          grep -qx '  CLAUDE.md' "$OUT" || { echo "❌ 輸出沒有列出根目錄的 CLAUDE.md"; sed 's/^/    /' "$OUT"; fail=1; }
          said "my dir/CLAUDE.md"
          echo doc > CLAUDE.md
          expect "只補根目錄：my dir 還欠，照擋" block commit t3
          said "my dir/CLAUDE.md"
          echo doc > "my dir/CLAUDE.md"
          expect "補上放行" pass commit t4
          echo t >> README.md
          expect "之後不再追討這兩個目錄" pass commit t5
          # 根目錄已經有 CLAUDE.md 時：它的路徑是其他目錄 CLAUDE.md 路徑的字尾，別的目錄更新 CLAUDE.md 不能抵掉它
          echo 2 >> top.js
          expect "SKIP 改根目錄程式碼" pass skip_commit t6
          echo more >> "my dir/CLAUDE.md"
          expect "只 staged my dir/CLAUDE.md：根目錄還欠，照擋" block commit t7
          said "  CLAUDE.md（段落起點之後"
          echo more >> CLAUDE.md
          expect "補上根目錄放行" pass commit t8
          # 同批 staged 這條路也要認得含空白的目錄名
          echo 1 > "my dir/b.js" && echo more2 >> "my dir/CLAUDE.md"
          expect "含空白目錄的程式碼和它的 CLAUDE.md 同批：放行" pass commit t9

          exit $fail

      - name: Sandbox 端到端安裝測試（非互動）
        run: |
          # runner 無 claude CLI，放一個只回版本號的假 binary 讓環境檢查通過
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\necho "2.1.200 (Claude Code)"\n' > /tmp/fakebin/claude
          chmod +x /tmp/fakebin/claude
          export PATH="/tmp/fakebin:$PATH"

          # --check：只檢查環境、不得寫入任何檔案（獨立乾淨 sandbox，驗 README 的「不安裝」宣稱）
          CHECK_SANDBOX="$(mktemp -d)"
          HOME="$CHECK_SANDBOX" ./install-dd-pipeline.sh --check < /dev/null
          [ -z "$(ls -A "$CHECK_SANDBOX")" ]
          echo "✅ --check 未寫入任何檔案"

          SANDBOX="$(mktemp -d)"

          # 首次安裝：非互動環境下互動詢問須走預設值，不得中止
          HOME="$SANDBOX" ./install-dd-pipeline.sh < /dev/null

          # 驗證部署結果 = 部署清單
          source ./install-dd-pipeline.sh
          [ "$(ls -d "$SANDBOX"/.claude/skills/*/ | wc -l)" -eq "${#PROMOTED_SKILLS[@]}" ]
          [ "$(ls "$SANDBOX"/.claude/agents/*.md | wc -l)" -eq "${#PROMOTED_AGENTS[@]}" ]
          [ -f "$SANDBOX/.claude/commands/dd-init.md" ]
          [ -d "$SANDBOX/.claude/commands/workflow-review" ]
          [ ! -f "$SANDBOX/.claude/commands/workflow-review/README.md" ]
          [ -x "$SANDBOX/.claude/scripts/check-claude-md.sh" ]
          echo "✅ 首次安裝部署內容正確"

          # 冪等：重跑不得改動內容、不得產生備份
          HOME="$SANDBOX" ./install-dd-pipeline.sh < /dev/null
          [ ! -d "$SANDBOX/.claude/backups" ]
          echo "✅ 重跑冪等（無備份產生 = 無檔案被覆蓋）"

          # --force：內容相同時不重寫，因此同樣不得產生備份
          HOME="$SANDBOX" ./install-dd-pipeline.sh --force < /dev/null
          [ ! -d "$SANDBOX/.claude/backups" ]
          echo "✅ --force 內容相同不重寫（無備份產生）"

          # --update 非互動可用
          HOME="$SANDBOX" ./install-dd-pipeline.sh --update < /dev/null
          echo "✅ --update 非互動可用"

          # --commands-only：只裝 commands，不得動到既有 skills
          skills_before=$(ls -d "$SANDBOX"/.claude/skills/*/ | wc -l)
          HOME="$SANDBOX" ./install-dd-pipeline.sh --commands-only < /dev/null
          [ "$(ls -d "$SANDBOX"/.claude/skills/*/ | wc -l)" -eq "$skills_before" ]
          [ -f "$SANDBOX/.claude/commands/dd-init.md" ]
          echo "✅ --commands-only 未動到既有 skills"

          # --uninstall 非互動走預設 N：取消移除、不得誤刪
          HOME="$SANDBOX" ./install-dd-pipeline.sh --uninstall < /dev/null
          [ -d "$SANDBOX/.claude/skills/code-simplifier" ]
          echo "✅ 非互動 uninstall 預設取消，未誤刪"
