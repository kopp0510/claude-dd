name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 安裝腳本檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 語法檢查
        run: bash -n install-dd-pipeline.sh

      - name: ShellCheck（error 級）
        run: shellcheck -S error install-dd-pipeline.sh

      - name: help smoke test
        run: ./install-dd-pipeline.sh --help

      - name: Skill hook 路徑驗證
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          bash -c 'source /tmp/inst.sh && validate_skill_hooks'

      - name: 陣列與目錄一致性
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          bash -c '
            source /tmp/inst.sh
            fail=0
            check() {
              local label="$1" expected="$2" actual="$3"
              if ! diff <(echo "$expected") <(echo "$actual"); then
                echo "❌ $label：陣列與實際目錄不一致（< 陣列 / > 目錄）"
                fail=1
              else
                echo "✅ $label 一致"
              fi
            }
            check "BUILTIN_SKILLS" \
              "$(printf "%s\n" "${BUILTIN_SKILLS[@]}" | sort)" \
              "$(ls -d skills/*/ | xargs -n1 basename | sort)"
            check "BUILTIN_AGENTS" \
              "$(printf "%s\n" "${BUILTIN_AGENTS[@]}" | sort)" \
              "$(ls agents/*.md | xargs -n1 basename | sed "s/\.md$//" | sort)"
            check "DD_COMMANDS" \
              "$(printf "%s\n" "${DD_COMMANDS[@]}" | sort)" \
              "$(ls commands/dd-*.md | xargs -n1 basename | sed "s/\.md$//" | sort)"
            check "NS_COMMANDS" \
              "$(printf "%s\n" "${NS_COMMANDS[@]}" | sort)" \
              "$(ls -d commands/*/ | xargs -n1 basename | sort)"
            check "DD_TEMPLATES" \
              "$(printf "%s\n" "${DD_TEMPLATES[@]}" | sort)" \
              "$(ls templates/*.template | xargs -n1 basename | sort)"
            exit $fail
          '

      - name: README 數字宣稱與 skill 列表一致性
        run: |
          fail=0; total=0
          while IFS= read -r line; do
            claimed=$(echo "$line" | grep -oE '，[0-9]+ 個' | grep -oE '[0-9]+')
            section=$(echo "$line" | sed 's/^### //; s/（.*//')
            actual=$(awk -v h="$line" 'index($0,h){f=1;next} f&&/^### /{exit} f' README.md \
              | awk -F'|' '/^\|/{gsub(/[^a-z0-9-]/,"",$2); print $2}' \
              | { c=0; while read -r s; do if [ -n "$s" ] && [ -d "skills/$s" ]; then c=$((c+1)); fi; done; echo $c; })
            total=$((total+actual))
            if [ "$claimed" != "$actual" ]; then
              echo "❌ ${section}：宣稱 $claimed 個，表格實際 $actual 個"; fail=1
            else
              echo "✅ ${section}：$claimed 個"
            fi
          done < <(grep -E '^### .*Skills（DD Pipeline 安裝，[0-9]+ 個）' README.md)
          dirs=$(ls -d skills/*/ | wc -l | tr -d ' ')
          if [ "$total" = "$dirs" ]; then
            echo "✅ 分類加總 $total = skills/ 目錄數 $dirs"
          else
            echo "❌ 分類加總 $total ≠ skills/ 目錄數 $dirs"; fail=1
          fi
          for s in $(ls skills/); do
            grep -q "$s" README.md || { echo "❌ README 未列出 skill：$s"; fail=1; }
          done
          exit $fail

      - name: 全域模板 §7.2 觸發目標存在性
        run: |
          grep -v '^main "\$@"$' install-dd-pipeline.sh > /tmp/inst.sh
          source /tmp/inst.sh
          fail=0
          targets=$(awk '/^### 7\.2/,/^### 7\.3/' templates/global/CLAUDE.md \
            | awk -F'|' '/^\|/{print $3}' | grep -oE '`[^`]+`' | tr -d '`' | sort -u)
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            base="${t##*:}"; ns="${t%%:*}"
            if [ -d "skills/$base" ] || [ -f "agents/$base.md" ]; then
              echo "✅ $t"
            elif [ "$t" != "$base" ] && printf '%s\n' "${OFFICIAL_PLUGINS[@]}" | grep -qx "$ns"; then
              echo "✅ ${t}（官方 plugin，install_plugins 會安裝）"
            else
              echo "❌ §7.2 觸發目標不存在：$t"; fail=1
            fi
          done <<< "$targets"
          exit $fail
