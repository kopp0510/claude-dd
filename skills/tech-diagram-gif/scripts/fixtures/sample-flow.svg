<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" width="1440" height="1060">
<style>
  text { font-family: -apple-system,'Helvetica Neue','PingFang TC','Noto Sans CJK TC',sans-serif; }
  .ttl { font-family: Georgia,'Times New Roman','Songti TC','Noto Serif CJK TC',serif;
         font-size: 31px; font-weight: 700; fill: #f5f0eb; }
  .sub { font-size: 16px; fill: #6b5f53; }
  .lbl { font-family: Georgia,'Times New Roman','Songti TC','Noto Serif CJK TC',serif;
         font-size: 16px; font-weight: 700; fill: #c9a96e; opacity: 0.75; letter-spacing: 0.06em; }
  .nm  { font-size: 20px; font-weight: 600; }
  .sm  { font-size: 15px; fill: #a39787; }
  .al  { font-size: 15px; fill: #8c7e72; }
</style>
<defs>
  <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
  <marker id="am" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
  <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f87171"/></marker>
  <marker id="ad" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#c9a96e"/></marker>
  <radialGradient id="glow" cx="52%" cy="62%" r="34%">
    <stop offset="0%" stop-color="#d4a574" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
</defs>

<rect width="1440" height="1060" fill="#0a0a0a"/>
<rect width="1440" height="1060" fill="url(#glow)"/>

<text class="ttl" x="80" y="66">DD Pipeline — 一次改動如何傳播</text>
<text class="sub" x="80" y="94">repo 是唯一真相；全域是它的部署；專案在 gate 底下跑迴圈，學到的再回流</text>

<!-- ===== 分組容器（先畫，node 之後蓋在上面） ===== -->
<rect x="80" y="110" width="850" height="160" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.4"/>
<text class="lbl" x="96" y="134">SOURCE OF TRUTH</text>

<rect x="1000" y="110" width="370" height="400" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.4"/>
<text class="lbl" x="1016" y="134">全域 ~/.claude/</text>

<rect x="150" y="600" width="1220" height="360" rx="8" fill="none" stroke="#d4a574" stroke-width="0.5" stroke-dasharray="6,4" opacity="0.4"/>
<text class="lbl" x="166" y="624">你的專案</text>

<!-- ===== 連線（先於節點，z-order） ===== -->
<!-- ① → ② 執行 -->
<path id="e1" d="M 430,188 L 560,188" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ② → ③ 部署 -->
<path id="e2" d="M 900,188 L 1030,188" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ③ → ④ 提供指令 -->
<path id="e3" d="M 1185,242 L 1185,400" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ④ → ⑤ 蓋章 + 掛 hook -->
<path id="e4" d="M 1185,476 L 1185,650" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ⑤ → ⑥ 在此執行 -->
<path id="e5" d="M 1040,692 L 910,692" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ⑥ → ⑦ commit 時觸發 -->
<path id="e6" d="M 590,692 L 480,692" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ⑦ → ⑧ 通過 -->
<path id="e7" d="M 330,750 L 330,850" fill="none" stroke="#d4a574" stroke-width="2" marker-end="url(#ag)"/>
<!-- ③ → ⑥ 載入規則與 skills（2 折） -->
<path id="e8" d="M 1060,242 L 1060,300 L 850,300 L 850,650" fill="none" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#am)"/>
<!-- ⑦ ⇢ ⑥ 擋回（2 折） -->
<path id="e9" d="M 330,634 L 330,580 L 650,580 L 650,650" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
<!-- ⑥ ⇢ ① 所學回流（2 折） -->
<path id="e10" d="M 720,650 L 720,320 L 270,320 L 270,226" fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.85" marker-end="url(#ad)"/>

<!-- ===== 邊標籤（遮罩與線留 ≥6px 可見間隙） ===== -->
<rect x="437" y="152" width="116" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="495" y="169" text-anchor="middle">執行</text>

<rect x="907" y="152" width="116" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="965" y="169" text-anchor="middle">部署</text>

<rect x="1197" y="308" width="120" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="1207" y="325">提供指令</text>

<rect x="1197" y="551" width="176" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="1207" y="568">蓋章 + 掛 hook</text>

<rect x="917" y="656" width="116" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="975" y="673" text-anchor="middle">在此執行</text>

<rect x="452" y="656" width="131" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="517" y="673" text-anchor="middle">commit 時觸發</text>


<rect x="866" y="266" width="176" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="1032" y="283" text-anchor="end">載入規則與 skills</text>

<rect x="410" y="546" width="188" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="504" y="563" text-anchor="middle" fill="#f87171">缺 CLAUDE.md → 擋回</text>

<rect x="330" y="286" width="212" height="24" fill="#0a0a0a" opacity="0.92"/>
<text class="al" x="436" y="303" text-anchor="middle">第 7、8 步所學回流</text>

<!-- ===== 節點（後畫，蓋住標籤遮罩不到之處） ===== -->
<!-- ① claude-dd repo -->
<rect x="110" y="150" width="320" height="76" rx="6" fill="#111111" stroke="#94a3b8" stroke-width="1.5"/>
<text class="nm" x="130" y="182" fill="#94a3b8">claude-dd repo</text>
<text class="sm" x="130" y="206">skills / agents / commands 的唯一真相</text>

<!-- ② install-dd-pipeline.sh -->
<rect x="560" y="150" width="340" height="76" rx="6" fill="#111111" stroke="#fbbf24" stroke-width="1.5"/>
<text class="nm" x="580" y="182" fill="#fbbf24">install-dd-pipeline.sh</text>
<text class="sm" x="580" y="206">--update 只更新 skills 與 agents</text>

<!-- ③ ~/.claude/ -->
<rect x="1030" y="150" width="310" height="92" rx="6" fill="#111111" stroke="#38bdf8" stroke-width="1.5"/>
<text class="nm" x="1050" y="182" fill="#38bdf8">~/.claude/</text>
<text class="sm" x="1050" y="206">全域 profile：CLAUDE.md +</text>
<text class="sm" x="1050" y="228">skills + agents + commands</text>

<!-- ④ /dd-init -->
<rect x="1040" y="400" width="290" height="76" rx="6" fill="#111111" stroke="#fbbf24" stroke-width="1.5"/>
<text class="nm" x="1060" y="432" fill="#fbbf24">/dd-init</text>
<text class="sm" x="1060" y="456">專案初始化指令</text>

<!-- ⑤ 你的專案 -->
<rect x="1040" y="650" width="290" height="84" rx="6" fill="#111111" stroke="#a78bfa" stroke-width="1.5"/>
<text class="nm" x="1060" y="682" fill="#a78bfa">專案設定</text>
<text class="sm" x="1060" y="706">專案 CLAUDE.md +</text>
<text class="sm" x="1060" y="726">.git/hooks/pre-commit</text>

<!-- ⑥ 8 步開發迴圈 -->
<rect x="590" y="650" width="320" height="84" rx="6" fill="#111111" stroke="#5a9e6f" stroke-width="1.5"/>
<text class="nm" x="610" y="682" fill="#5a9e6f">8 步開發迴圈</text>
<text class="sm" x="610" y="706">實作+測試 → commit → 簡化 → review</text>
<text class="sm" x="610" y="726">→ 再測 → commit → 沉澱 → 評分</text>

<!-- ⑦ pre-commit gate（決策菱形 · focal 1） -->
<polygon points="330,634 480,692 330,750 180,692" fill="#111111" stroke="#f87171" stroke-width="2"/>
<text class="nm" x="330" y="686" text-anchor="middle" fill="#f87171" font-size="16">pre-commit gate</text>
<text x="330" y="708" text-anchor="middle" font-size="14" fill="#a39787">CLAUDE.md 同批更新？</text>

<!-- ⑧ commit 成功 -->
<rect x="200" y="850" width="260" height="68" rx="6" fill="#111111" stroke="#5a9e6f" stroke-width="1.5"/>
<text class="nm" x="220" y="882" fill="#5a9e6f">commit 成功</text>
<text class="sm" x="220" y="904">改碼與文件同批落地</text>

<!-- ===== 小球（等速兩檔：短線 2s、長線 8s；皆整除 8s） ===== -->
