<!-- ===== legend（流程走廊外，底部橫條） ===== -->
<line x1="80" y1="995" x2="1360" y2="995" stroke="#d4a574" stroke-width="0.5" opacity="0.25"/>
<line x1="80" y1="1022" x2="128" y2="1022" stroke="#d4a574" stroke-width="2"/>
<text class="al" x="138" y="1027">主流程</text>
<line x1="250" y1="1022" x2="298" y2="1022" stroke="#6ee7b7" stroke-width="1.5"/>
